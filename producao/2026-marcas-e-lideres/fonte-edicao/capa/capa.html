<html><head><style>
@font-face{font-family:Sora;src:url(sora-var.woff2) format('woff2');font-weight:100 800}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:Sora;color:#fff;background:radial-gradient(ellipse at 50% 18%,#243656 0%,#0F1B33 45%,#0A1222 100%)}

<div class="foto"></div><div class="base"></div>
